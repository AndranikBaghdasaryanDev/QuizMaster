openapi: 3.0.3
info:
  title: Quiz Master API
  description: API for user authentication and management
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /auth/signup:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
              required:
                - name
                - username
                - email
                - password
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Please verify your email to complete registration."
                  payload:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "64f633442aadd4e271147ae"
        '400':
          description: Invalid payload or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'

  /auth/login:
    post:
      summary: Login a user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseToken'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'

  /auth/user:
    get:
      summary: Get currently authenticated user
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IUserSafe'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    IUser:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        username:
          type: string
        email:
          type: string
        password:
          type: string
        isVerified:
          type: boolean
        verifyToken:
          type: string
        verifyExpires:
          type: string
          format: date-time
      required:
        - name
        - username
        - email
        - password
    IUserSafe:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        username:
          type: string
        email:
          type: string
        isVerified:
          type: boolean
        verifyToken:
          type: string
        verifyExpires:
          type: string
          format: date-time
      required:
        - _id
        - name
        - username
        - email
    IResponseUser:
      type: object
      properties:
        error:
          type: boolean
        message:
          type: string
        payload:
          $ref: '#/components/schemas/IUser'

    IResponseToken:
      type: object
      properties:
        error:
          type: boolean
        message:
          type: string
        payload:
          type: object
          properties:
            token:
              type: string

    IResponseError:
      type: object
      properties:
        error:
          type: boolean
        message:
          type: string
        payload:
          type: object
