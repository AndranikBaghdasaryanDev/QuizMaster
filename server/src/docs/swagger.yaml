openapi: 3.0.3
info:
  title: Quiz Master API
  description: API for user authentication and management
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  # --- Auth Endpoints ---

  /auth/signup:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                username:
                  type: string
                email:
                  type: string
                password:
                  type: string
              required:
                - name
                - username
                - email
                - password
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Please verify your email to complete registration."
                  payload:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "64f633442aadd4e271147ae"
        '400':
          description: Invalid payload or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'

  /auth/login:
    post:
      summary: Login a user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseToken'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'

  /auth/user:
    get:
      summary: Get currently authenticated user
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IUserSafe'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
  # --- User Endpoints ---
  
  /user/verify:
    post:
      summary: Verify a user's email using a token
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
      responses:
        '200':
          description: Email successfully verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Successfully verified"
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
  /user/forgot:
    post:
      summary: Send a password reset link to user's email
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
                - email
      responses:
        '200':
          description: Password reset link sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "The link for reseting the password was sent to your email. Please enter by that link and change your password."
        '400':
          description: Invalid payload or email not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
  /user/reset:
    post:
      summary: Reset user's password using a valid token
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
              required:
                - token
                - password
      responses:
        '200':
          description: Password successfully reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Your password got reset successfully"
        '400':
          description: Invalid payload or password requirements not met
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
        '404':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
  
  # --- Quiz Endpoints ---
  /quiz:
    post:
      summary: Add a new quiz
      tags:
        - Quiz
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IResponseQuiz'
      responses:
        '201':
          description: Quiz created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseQuiz'
        '400':
          description: Invalid payload or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
    get:
      summary: Get all quizzes with optional filters
      description: >
        Returns a list of quizzes.  
        If no filters are provided, only quizzes with `isActive: true` are returned.  
        If `owner_id` is specified and it is **not the logged-in user**, only quizzes that are **active** and within the valid availability period (`availableFrom` / `availableUntil`) are shown.
      tags:
        - Quiz
      security:
        - bearerAuth: []
      parameters:
        - name: owner_id
          in: query
          required: false
          schema:
            type: string
          description: Filter by owner (user ID)
        - name: access
          in: query
          required: false
          schema:
            type: string
            enum: [free, pro, premium]
          description: >
            Filter by access level.  
            - If `free`, only free quizzes are shown.  
            - If `pro`, includes `free` and `pro` quizzes.  
            - If `premium`, includes all access levels.
        - name: level
          in: query
          required: false
          schema:
            type: string
            enum: [easy, medium, hard]
          description: Filter quizzes by difficulty level.
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter by category ID.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Limit number of results.
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          description: Number of results to skip (for pagination).
      responses:
        '200':
          description: Quizzes fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Success"
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/IQuiz'
        '400':
          description: Invalid filter parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'

  /quiz/{id}:
    get:
      summary: Get a single quiz by ID
      description: >
        Returns a single quiz with its category populated.  
        Requires a valid quiz ID in the path parameter.
      tags:
        - Quiz
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Quiz ID
          schema:
            type: string
      responses:
        '200':
          description: Quiz fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: "Success"
                  payload:
                    $ref: '#/components/schemas/IQuiz'
        '400':
          description: Invalid or missing quiz ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
        '404':
          description: Quiz not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IResponseError'


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    IUser:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        username:
          type: string
        email:
          type: string
        password:
          type: string
        isVerified:
          type: boolean
        verifyToken:
          type: string
        verifyExpires:
          type: string
          format: date-time
      required:
        - name
        - username
        - email
        - password
    IUserSafe:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        username:
          type: string
        email:
          type: string
        isVerified:
          type: boolean
      required:
        - _id
        - name
        - username
        - email
    IResponseUser:
      type: object
      properties:
        error:
          type: boolean
        message:
          type: string
        payload:
          $ref: '#/components/schemas/IUser'

    IResponseToken:
      type: object
      properties:
        error:
          type: boolean
        message:
          type: string
        payload:
          type: object
          properties:
            token:
              type: string

    IResponseError:
      type: object
      properties:
        error:
          type: boolean
        message:
          type: string
        payload:
          type: object
    IAnswer:
      type: object
      properties:
        text:
          type: string
          example: "4"
        isCorrect:
          type: boolean
          example: true
      required:
        - text
        - isCorrect

    IQuestion:
      type: object
      properties:
        text:
          type: string
          example: "What is 2 + 2?"
        type:
          type: string
          enum:
            - single
            - multiple
            - input
          example: "single"
        points:
          type: integer
          default: 1
        options:
          type: array
          items:
            $ref: '#/components/schemas/IAnswer'
          nullable: true
        inputAnswer:
          type: string
          nullable: true
      required:
        - text
        - type

    IQuizCreate:
      type: object
      properties:
        title:
          type: string
          example: "Math Basics"
        description:
          type: string
          example: "A quiz on basic math operations"
        access:
          type: string
          enum:
            - free
            - pro
            - premium
          example: "free"
        isActive:
          type: boolean
          default: true
        category:
          type: string
          example: "64f633442aodd4e924847ae"
        level:
          type: string
          example: "medium"
        availableFrom:
          type: string
          format: date-time
          nullable: true
        availableUntil:
          type: string
          format: date-time
          nullable: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/IQuestion'
      required:
        - title
        - description
        - questions

    IQuiz:
      type: object
      properties:
        _id:
          type: string
          example: "650c1f1a2e5b6f001234abcd"
        title:
          type: string
          example: "Math Basics"
        description:
          type: string
          example: "A quiz on basic math operations"
        owner_id:
          type: string
          example: "64f633442aadd4e271147ae"
        access:
          type: string
          example: "free"
        isActive:
          type: boolean
          example: true
        availableFrom:
          type: string
          format: date-time
          nullable: true
        availableUntil:
          type: string
          format: date-time
          nullable: true
        questions:
          type: array
          items:
            $ref: '#/components/schemas/IQuestion'

    IResponseQuiz:
      type: object
      properties:
        error:
          type: boolean
          example: false
        message:
          type: string
          example: "Quiz added successfully"
        payload:
          $ref: '#/components/schemas/IQuiz'